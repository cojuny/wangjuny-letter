<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="왕주니의 고백에 YES! 오늘은 조금 더 특별한 날. ♡">
  <title>왕주니의 가장 행복한 순간 💗</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="yes-page">
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  <main class="site-wrap success-wrap">
    <header class="site-head" aria-label="편지 보낸 사람">
      <span class="wordmark"><span class="wordmark-heart">♥</span> FROM. 왕주니</span>
      <span class="head-right">our little beginning <span aria-hidden="true">↗</span></span>
    </header>

    <section class="success-card" aria-labelledby="successTitle">
      <div class="success-stars" aria-hidden="true">
        <span class="success-star star-one">✧</span>
        <span class="success-star star-two">✦</span>
        <span class="success-star star-three">♡</span>
        <span class="success-star star-four">✧</span>
      </div>
      <p class="success-eyebrow">YOU SAID YES! <span aria-hidden="true">♡</span></p>
      <div class="success-heart-wrap" aria-hidden="true">
        <svg class="success-heart" viewBox="0 0 200 178" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="heartShade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9db9"/><stop offset="1" stop-color="#ec628f"/></linearGradient></defs>
          <path d="M100 165 21 94C-18 58 28-6 77 25l23 23 23-23c49-31 95 33 56 69z" fill="url(#heartShade)"/>
          <path d="M45 48c9-10 20-13 31-7" stroke="#ffccd9" stroke-width="9" stroke-linecap="round" fill="none" opacity=".85"/>
        </svg>
        <span class="mini-heart mini-one">♥</span><span class="mini-heart mini-two">♥</span>
      </div>
      <h1 id="successTitle">진짜? 나 지금<br><span class="highlight">너무 행복해!</span> 🥹</h1>
      <p class="success-description">내 마음 받아줘서 정말 고마워.<br>앞으로 너랑 같이 웃고, 같이 걷고,<br>평범한 하루도 소중하게 만들고 싶어.</p>
      <div class="promise-card"><span aria-hidden="true">🤍</span><span>평생 하루도 빠짐없이 너만을 사랑할게!</span></div>
      <div class="success-signature">Best regards.<br><strong>— 왕주니가 ♡</strong></div>
      <div class="success-end" aria-hidden="true"><span></span> ♡ <span></span></div>
    </section>

    <footer class="site-footer"><span>오늘, 나한테는 오래 기억될 날.</span><span>♡ 2026</span></footer>
  </main>
</body>
</html>
